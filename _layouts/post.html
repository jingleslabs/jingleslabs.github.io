<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: page.title }}">
    <meta name="theme-color" content="#8b5cf6">
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
    {% include navbar.html %}

    <main>
        <div class="content-container">
            <article class="post-content">
                <header class="post-header-full">
                    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %d, %Y" }}</time>
                    <h1>{{ page.title }}</h1>
                </header>

                <div class="post-body">
                    {{ content }}
                </div>

                <nav class="post-nav">
                    <a href="{{ '/' | relative_url }}" class="back-link">&larr; All posts</a>
                </nav>
            </article>
        </div>
    </main>
</body>
</html>
