<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f5f1e8">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Belle — An open notebook</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="Belle's notebook" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="{{ '/assets/notebook.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include navbar.html %}
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Belle home">belle<span>✳</span></a>
    <p>An open notebook. A work in progress.</p>
    <div><a href="{{ '/feed.xml' | relative_url }}">RSS feed ↗</a><a href="#top">Back to top ↑</a></div>
  </footer>
</body>
</html>
